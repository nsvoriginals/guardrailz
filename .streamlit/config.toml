[theme]
base = "dark"
primaryColor = "#7C5CFF"
backgroundColor = "#050507"
secondaryBackgroundColor = "#0F0F16"
textColor = "#F2F2F7"
linkColor = "#7FE3D6"
font = "Satoshi"
headingFont = "Nothing Font"
codeFont = "JetBrains Mono"
headingFontWeights = [400, 400, 400, 400, 400, 400]
headingFontSizes = ["3rem", "2.35rem", "1.8rem", "1.45rem", "1.25rem", "1.1rem"]
metricValueFontSize = "2.3rem"
borderColor = "#1B1B29"
dataframeBorderColor = "#1B1B29"
dataframeHeaderBackgroundColor = "#12121C"
dataframeHeaderTextColor = "#8A8AA6"
baseRadius = "0.85rem"
buttonRadius = "0.85rem"
linkUnderline = false
showWidgetBorder = false

[[theme.fontFaces]]
family = "Nothing Font"
url = "app/static/nothing-font.otf"
weight = "400"
style = "normal"

[server]
headless = true
enableStaticServing = true

[client]
toolbarMode = "minimal"
